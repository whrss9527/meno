name: CI

# Pull requests, including forks, run the real required checks with read-only
# permissions. Main pushes and explicit branch dispatches also run full checks.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      compare_scans:
        description: "Compare all-process CPU with periodic scan gating disabled"
        type: boolean
        default: false
      runner:
        description: "Also run on this runner, for example macos-27 for a new macOS"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A branch dispatch must not cancel a PR's required check suite. New commits
  # still replace obsolete runs of the same PR, main push or branch dispatch.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Linux core tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Python for repository checks
        run: command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3)
      - name: Release metadata
        run: |
          scripts/check-release.sh
          python3 -m unittest discover -s scripts/tests
      - run: swift test
      - name: Command-check cancellation
        timeout-minutes: 3
        run: scripts/check-command-checks.sh
      - name: Localization
        run: python3 scripts/check-localization.py

  build:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 26 with the current SDK, where the Liquid Glass code paths
        # are compiled, and macOS 15 with the previous one, where the
        # material fallbacks are. A run by hand can add another runner, such
        # as a new macOS, to see whether hiding and moving still work there.
        include: ${{ fromJSON(format('[{{"name":"26 / Xcode 26","runner":"macos-26"}},{{"name":"15 / Xcode 16","runner":"macos-15"}}{0}]', inputs.runner && format(',{{"name":"{0}","runner":"{0}"}}', inputs.runner) || '')) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Localization
        run: |
          python3 scripts/check-localization.py
          for file in Resources/*.lproj/*.strings; do plutil -lint "$file"; done

      - name: Strict concurrency baseline
        run: scripts/check-concurrency.sh

      - name: Unit tests
        run: swift test

      - name: Hiding and restart lifecycle
        timeout-minutes: 5
        run: scripts/check-hiding-lifecycle.sh

      - name: Image-cache lifecycle
        timeout-minutes: 3
        run: scripts/check-image-cache.sh

      - name: Command-check cancellation
        timeout-minutes: 3
        run: scripts/check-command-checks.sh

      - name: Simultaneous launch arbitration
        timeout-minutes: 3
        run: scripts/check-single-instance.sh

      - name: Secure input gates
        timeout-minutes: 3
        run: scripts/check-secure-input.sh

      - name: Build app bundle
        run: make zip

      # Leaves the app alone for a minute twice, as set up and with other
      # apps' items, hover and a rule; measured for main and runs by hand,
      # not for every PR update. Fails above the limits in the script.
      - name: Scan baseline without gating
        if: github.event_name == 'workflow_dispatch' && inputs.compare_scans
        timeout-minutes: 8
        env:
          MENO_SCAN_GATE: "0"
        run: scripts/measure-footprint.sh build/Meno.app

      - name: Footprint while idle
        env:
          MENO_REQUIRE_SCAN_SKIP: ${{ inputs.compare_scans && '1' || '0' }}
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        run: scripts/measure-footprint.sh build/Meno.app

      - name: Hiding end to end
        timeout-minutes: 5
        run: scripts/check-hiding.sh build/Meno.app

      - name: Moving end to end
        timeout-minutes: 7
        run: scripts/check-moving.sh build/Meno.app

      - name: Updating end to end
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: scripts/check-updating.sh

      - name: Upload App Intents extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-intents-${{ matrix.runner }}
          path: build/app-intents/
          if-no-files-found: warn

      - name: Upload app
        if: matrix.runner == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: Meno
          path: build/Meno.zip
          if-no-files-found: error
