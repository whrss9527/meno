name: Release

# Publishes a version with the shared release workflow in whrss9527/frit:
# builds the universal app, signs it with the Developer ID certificate and
# has Apple notarize it when the repository secrets are set (see Frit's
# docs/release.md), staples the ticket, and uploads Meno.zip and
# SHA256SUMS.txt. The notes come from .github/releases/<tag>.md.
#
# Push a v* tag, or run this workflow with a version; the tag is then
# created at the selected commit. Tick "dry run" to only build and check.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.10.0"
        required: true
      overwrite:
        description: "Rebuild an existing version and replace its files"
        type: boolean
        default: false
      dry_run:
        description: "Only build, sign and notarize; do not tag or publish"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check requested version and notes
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: scripts/check-release.sh "$RELEASE_VERSION"

  release:
    needs: metadata
    # Frit is pinned to a commit; change the @ below and frit-ref together.
    uses: whrss9527/frit/.github/workflows/release-app.yml@6f27e71aab8831a9b007e6ee5b022cf19cadb0a8
    with:
      app-name: Meno
      tag: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
      # A pushed tag already exists, so build at the tag.
      overwrite: ${{ github.ref_type == 'tag' || inputs.overwrite }}
      dry-run: ${{ github.ref_type != 'tag' && inputs.dry_run }}
      build-command: >-
        SIGN_IDENTITY="${CODESIGN_IDENTITY:--}" SIGN_KEYCHAIN="${CODESIGN_KEYCHAIN:-}" UNIVERSAL=1 make zip &&
        lipo -archs build/Meno.app/Contents/MacOS/Meno | grep -q arm64 &&
        lipo -archs build/Meno.app/Contents/MacOS/Meno | grep -q x86_64
      archives: build/Meno.zip
      notes-command: scripts/release-notes.sh
      require-notarization: true
      frit-ref: 6f27e71aab8831a9b007e6ee5b022cf19cadb0a8
      runner: macos-26
    secrets: inherit
