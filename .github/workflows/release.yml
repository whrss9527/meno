name: Release

on:
  push:
    tags:
      - "v*"
  # Run manually to publish a version (the tag is created at the selected
  # commit) or, without a version, to only build and check a release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none (build only)}"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build universal app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            export VERSION="$RELEASE_VERSION"
          fi
          UNIVERSAL=1 make zip

      - name: Verify bundle
        run: |
          lipo -archs build/Meno.app/Contents/MacOS/Meno
          lipo -archs build/Meno.app/Contents/MacOS/Meno | grep -q arm64
          lipo -archs build/Meno.app/Contents/MacOS/Meno | grep -q x86_64
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Meno.app/Contents/Info.plist
          codesign --verify --strict build/Meno.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Meno-universal
          path: build/Meno.zip
          if-no-files-found: error

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes=".github/releases/${TAG}.md"
          args=(--title "Meno ${TAG#v}" --target "$GITHUB_SHA")
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$TAG" build/Meno.zip "${args[@]}"
