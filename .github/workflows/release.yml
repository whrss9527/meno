name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 make zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Meno.zip \
            --title "Meno ${GITHUB_REF_NAME#v}" \
            --generate-notes
